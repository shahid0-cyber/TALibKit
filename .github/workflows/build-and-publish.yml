name: Build and Publish TALibKit

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "TA-Lib version tag to build (e.g. v0.7.1). Leave empty to auto-detect latest."
        required: false
        type: string

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      latest: ${{ steps.get.outputs.latest }}
      current: ${{ steps.current.outputs.current }}
      should_build: ${{ steps.compare.outputs.should_build }}
    steps:
      - uses: actions/checkout@v4

      - name: Get latest TA-Lib release
        id: get
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "latest=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            LATEST=$(gh release view --repo TA-Lib/ta-lib --json tagName -q .tagName)
            echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          fi

      - name: Get current pinned version
        id: current
        run: |
          if [ -f VERSION.txt ]; then
            echo "current=$(cat VERSION.txt)" >> "$GITHUB_OUTPUT"
          else
            echo "current=none" >> "$GITHUB_OUTPUT"
          fi

      - name: Compare versions
        id: compare
        run: |
          if [ "${{ steps.get.outputs.latest }}" != "${{ steps.current.outputs.current }}" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check-version
    if: needs.check-version.outputs.should_build == 'true'
    runs-on: macos-26
    env:
      TALIB_VERSION: ${{ needs.check-version.outputs.latest }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Show toolchain versions
        run: |
          sw_vers
          xcodebuild -version
          swift --version
          node --version

      - name: Build XCFramework
        run: |
          chmod +x scripts/build_xcframework.sh
          ./scripts/build_xcframework.sh "$TALIB_VERSION"

      - name: Compute checksum
        id: checksum
        run: |
          CHECKSUM=$(swift package compute-checksum talib_build/out/TALibKit.xcframework.zip)
          echo "checksum=$CHECKSUM" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release with asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TALIB_VERSION }}
          name: "TALibKit ${{ env.TALIB_VERSION }}"
          files: talib_build/out/TALibKit.xcframework.zip
          body: "Auto-built XCFramework wrapping TA-Lib ${{ env.TALIB_VERSION }}."

      - name: Update Package.swift
        env:
          ASSET_URL: https://github.com/${{ github.repository }}/releases/download/${{ env.TALIB_VERSION }}/TALibKit.xcframework.zip
          CHECKSUM: ${{ steps.checksum.outputs.checksum }}
        run: |
          python3 - <<'PY'
from pathlib import Path
import os
content = Path('Package.swift').read_text()
content = content.replace('TALIB_XCFRAMEWORK_URL_PLACEHOLDER', os.environ['ASSET_URL'])
content = content.replace('TALIB_XCFRAMEWORK_CHECKSUM_PLACEHOLDER', os.environ['CHECKSUM'])
Path('Package.swift').write_text(content)
PY
          echo "$TALIB_VERSION" > VERSION.txt

      - name: Update README with new version/link
        env:
          ASSET_URL: https://github.com/${{ github.repository }}/releases/download/${{ env.TALIB_VERSION }}/TALibKit.xcframework.zip
        run: |
          python3 scripts/update_readme.py "$TALIB_VERSION" "$ASSET_URL" "${{ github.repository }}"

      - name: Commit updated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md VERSION.txt Package.swift
          git commit -m "chore: update TALibKit to ${TALIB_VERSION}" || echo "No changes to commit"
          git push
